[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "firecrawl_arcade"
version = "1.0.0"
description = "Arcade MCP server for Firecrawl: Optimized web scraping, search, crawl, and research tools on API v2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "arcade-mcp-server>=1.17.0,<2.0.0",
    "arcade-tdk>=3.0.0,<4.0.0",
    "firecrawl-py>=4.40.0,<5.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.scripts]
firecrawl-arcade = "firecrawl_arcade.server:main"
firecrawl_arcade = "firecrawl_arcade.server:main"

[[project.authors]]
name = "Firecrawl"
email = "support@firecrawl.dev"

[project.optional-dependencies]
dev = [
    "arcade-mcp[evals]>=1.15.2,<2.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=4.0.0,<6.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["firecrawl_arcade"]

[tool.uv]
exclude-newer-package = { arcade-mcp-server = false, arcade-tdk = false, arcade-core = false, arcade-serve = false }
